# Ruff configuration for 左联知识库
target-version = "py312"
line-length = 120

[lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "SIM108", # ternary operator (readability preference)
]

[lint.per-file-ignores]
"research/analysis/*" = [
    "E741",   # ambiguous variable names in research scripts
    "B905",   # zip without strict= (historical research scripts, not in runtime path)
    "UP031",  # printf-style formatting (historical)
    "E402",   # module import not at top (sys.path setup in scripts)
    "F841",   # unused variable (historical)
    "E701",   # multiple statements on one line (historical)
    "E722",   # bare except (historical)
    "B007",   # unused loop control variable (historical)
    "SIM103", # needless bool (historical)
    "SIM105", # suppressible exception (historical)
    "SIM118", # in dict keys (historical)
]

[format]
quote-style = "preserve"
indent-style = "space"
